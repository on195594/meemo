services:
  meemo:
    build:
      context: .
    image: meemo:local
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - meemo_data:/app/data
    environment:
      NODE_ENV: production
      MONGODB_URL: mongodb://mongodb:27017/meemo
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      USERS_FILE: /app/data/.users.json
      ATTACHMENT_DIR: /app/data/storage
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET environment variable must be set in production}
    ports:
      - "${MEEMO_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:3000/api/health/ready
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 20s

  mongodb:
    image: mongo:8
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - "mongosh --quiet --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 2)'"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

volumes:
  meemo_data:
  mongodb_data:

networks:
  backend:
    driver: bridge
