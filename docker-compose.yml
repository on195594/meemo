services:
  meemo:
    build:
      context: .
    image: meemo:local
    volumes:
      - meemo_data:/app/data
    environment:
      MONGODB_URL: mongodb://mongodb:27017/meemo
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      USERS_FILE: /app/data/.users.json
      ATTACHMENT_DIR: /app/data/storage
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "${MEEMO_PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  mongodb:
    image: mongo:5.0.20
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - "mongo --quiet --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 2)'"
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

volumes:
  meemo_data:
  mongodb_data:

networks:
  backend:
    driver: bridge
