# Sample Nginx reverse proxy configuration for Meemo
# Offloads gzip/brotli compression, SSL termination, and static caching from Node.js

upstream meemo_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name meemo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meemo.example.com;

    # SSL configuration (replace with your certificates)
    # ssl_certificate /etc/letsencrypt/live/meemo.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/meemo.example.com/privkey.pem;

    # Request and upload limits (supports up to 50MB note imports)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/xhtml+xml
        application/xml
        font/otf
        image/bmp
        image/svg+xml
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/vcard
        text/xml;

    # Brotli compression (uncomment if ngx_brotli module is enabled)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml;

    # Default proxy location
    location / {
        proxy_pass http://meemo_backend;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # Cache Vite hashed static assets
    location /assets/ {
        proxy_pass http://meemo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
