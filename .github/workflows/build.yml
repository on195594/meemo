name: Validation quality gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Type-check frontend
        run: npm --prefix web run typecheck

      - name: Build frontend
        run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image from current checkout
        run: docker build -t meemo:ci .

  integration:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-secret-token-for-compose-stack-32chars

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start compose stack
        run: docker compose up --build -d

      - name: Smoke-test application endpoints
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready >/dev/null; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-user","password":"ci-password","email":"ci@example.invalid","displayName":"CI User"}' \
            http://127.0.0.1:3000/api/register >/dev/null

          curl --fail --silent --show-error \
            -c "${RUNNER_TEMP}/meemo-cookies" \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-user","password":"ci-password"}' \
            http://127.0.0.1:3000/api/login >/dev/null

          curl --fail --silent --show-error \
            -b "${RUNNER_TEMP}/meemo-cookies" \
            http://127.0.0.1:3000/api/profile >/dev/null

          curl --fail --silent --show-error \
            -b "${RUNNER_TEMP}/meemo-cookies" \
            http://127.0.0.1:3000/api/things >/dev/null

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop compose stack
        if: always()
        run: docker compose down -v
