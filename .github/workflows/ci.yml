name: RC validation gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Clean install
        run: |
          npm ci
          npm --prefix web ci
      - name: Verify quality baseline
        run: npm run verify:quality

  integration:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
      REGISTRATION_MODE: open
      AUTH_USER_SOURCE: mongo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run integration verification
        run: npm run verify:integration

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: meemo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
